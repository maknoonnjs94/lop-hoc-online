# Dựng ứng dụng máy tính cho Windows và macOS trên máy của GitHub.
# Cách kích hoạt: đẩy một thẻ (tag) tên v1.0.2, v1.0.3… đúng bằng "version" trong app/package.json
# (electron-builder tìm Release theo tên v<version>), hoặc bấm "Run workflow" trong tab Actions.
# electron-builder tự tạo Release và đưa lên: LopHoc-win.exe + latest.yml (để app tự cập nhật),
# LopHoc-mac.dmg. Link cố định: https://github.com/maknoonnjs94/lop-hoc-online/releases/latest/download/LopHoc-win.exe
name: Dựng ứng dụng máy tính

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      # Dựng thôi, KHÔNG để electron-builder tự đưa lên (hai máy cùng tạo Release một lúc là hỏng).
      # Có cấu hình "publish" trong package.json nên latest.yml vẫn được sinh ra — app cần file đó để tự cập nhật.
      - name: Dựng bản Windows (.exe + latest.yml)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Kiểm latest.yml (thiếu là app không tự cập nhật được)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path dist/latest.yml)) { throw "Không thấy dist/latest.yml" }

      - name: Dựng bản macOS (.dmg, không ký)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Giữ lại tệp cài
        uses: actions/upload-artifact@v4
        with:
          name: lop-hoc-${{ runner.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/latest*.yml
            app/dist/*.blockmap
          if-no-files-found: error

      # Chép lên Cloudflare R2 — nơi sinh viên tải app và app tự hỏi cập nhật (mạng Việt Nam vào R2 ổn hơn GitHub nhiều).
      # Tên tệp cố định nên bản mới ghi đè bản cũ, kho luôn chỉ ~270 MB. Chưa có secrets thì bỏ qua, không hỏng job.
      - name: Chép lên Cloudflare R2
        shell: bash
        continue-on-error: true          # R2 hỏng thì vẫn đưa lên GitHub Releases, không kéo cả job chết theo
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'giang-duong-hoa-hoc-app' }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::Thiếu secret R2 (R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY) — bỏ qua bước chép lên R2."
            exit 0
          fi
          ID=$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$ID" ]; then echo "::error::R2_ACCOUNT_ID không đúng dạng (cần mã 32 ký tự hex)"; exit 1; fi
          EP="https://$ID.r2.cloudflarestorage.com"
          # cắt khoảng trắng / xuống dòng lỡ dán kèm theo khoá (đã gặp thật: Access Key ID có ký tự xuống dòng ở đuôi)
          export AWS_ACCESS_KEY_ID="$(printf "%s" "$AWS_ACCESS_KEY_ID" | tr -d "[:space:]")"
          export AWS_SECRET_ACCESS_KEY="$(printf "%s" "$AWS_SECRET_ACCESS_KEY" | tr -d "[:space:]")"
          # Hai ô bị dán tráo (Access Key ID phải 32 ký tự, Secret 64) thì tự đảo lại; cùng một chuỗi ở cả hai ô thì báo rõ.
          if [ "${#AWS_ACCESS_KEY_ID}" = "64" ] && [ "${#AWS_SECRET_ACCESS_KEY}" = "32" ]; then
            echo "::warning::R2_ACCESS_KEY_ID và R2_SECRET_ACCESS_KEY bị dán tráo chỗ — tự đảo lại. Sửa lại secret cho đúng khi rảnh."
            T="$AWS_ACCESS_KEY_ID"; export AWS_ACCESS_KEY_ID="$AWS_SECRET_ACCESS_KEY"; export AWS_SECRET_ACCESS_KEY="$T"
          fi
          if [ "${#AWS_ACCESS_KEY_ID}" != "32" ]; then
            echo "::error::R2_ACCESS_KEY_ID đang dài ${#AWS_ACCESS_KEY_ID} ký tự, phải là Access Key ID 32 ký tự (Secret Access Key mới dài 64). Sửa secret trên GitHub."; exit 1
          fi
          echo "aws: $(aws --version 2>&1)"
          echo "endpoint: $EP · kho: $R2_BUCKET · độ dài Access Key ID: ${#AWS_ACCESS_KEY_ID} · độ dài Secret: ${#AWS_SECRET_ACCESS_KEY}"
          if ! aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$EP" > r2out.txt 2> r2err.txt; then
            echo "--- aws stderr ---"; cat r2err.txt; echo "--- aws stdout ---"; cat r2out.txt
            ERR=$(cat r2err.txt r2out.txt | tr -s '\r\n' '  ' | tail -c 500)
            echo "::error::Không vào được kho R2 [$R2_BUCKET @ $EP] — $ERR"
            { echo "### R2: KHÔNG vào được kho"; echo '```'; cat r2err.txt r2out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "Gợi ý: InvalidAccessKeyId / SignatureDoesNotMatch = sai Access Key ID hoặc Secret; NoSuchBucket = tên kho không phải '$R2_BUCKET' (đặt biến R2_BUCKET trong Settings → Secrets and variables → Actions → Variables); AccessDenied = token không có quyền Object Read & Write cho kho này."
            exit 1
          fi
          for f in dist/LopHoc-win.exe dist/LopHoc-win.exe.blockmap dist/LopHoc-mac.dmg dist/LopHoc-mac.dmg.blockmap; do
            if [ -f "$f" ]; then
              aws s3 cp "$f" "s3://$R2_BUCKET/$(basename "$f")" --endpoint-url "$EP" --content-type application/octet-stream --cache-control "public, max-age=300" && echo "đã chép $f"
            fi
          done
          for f in dist/latest.yml dist/latest-mac.yml; do
            if [ -f "$f" ]; then
              aws s3 cp "$f" "s3://$R2_BUCKET/$(basename "$f")" --endpoint-url "$EP" --content-type text/yaml --cache-control "no-cache" && echo "đã chép $f"
            fi
          done
          echo "Kho R2 hiện có:"; aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$EP"

      # Bước này chịu được việc hai máy cùng đưa lên một Release: máy nào tới sau thì thêm tệp vào Release có sẵn.
      - name: Đưa lên Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ứng dụng Lớp học ${{ github.ref_name }}
          body: |
            Bản cài ứng dụng Lớp học cho máy tính.
            - Windows: tải LopHoc-win.exe, chạy, nếu SmartScreen hỏi thì bấm "More info" → "Run anyway". Từ bản này app tự cập nhật.
            - macOS: tải LopHoc-mac.dmg, kéo vào Applications, lần đầu mở bằng chuột phải → Open. Mac chưa tự cập nhật (bản chưa ký số).
          files: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/latest*.yml
            app/dist/*.blockmap
