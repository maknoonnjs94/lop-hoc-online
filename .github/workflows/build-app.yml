# Dựng ứng dụng máy tính cho Windows và macOS trên máy của GitHub.
# Cách kích hoạt: đẩy một thẻ (tag) tên v1.0.2, v1.0.3… đúng bằng "version" trong app/package.json
# (electron-builder tìm Release theo tên v<version>), hoặc bấm "Run workflow" trong tab Actions.
# electron-builder tự tạo Release và đưa lên: LopHoc-win.exe + latest.yml (để app tự cập nhật),
# LopHoc-mac.dmg. Link cố định: https://github.com/maknoonnjs94/lop-hoc-online/releases/latest/download/LopHoc-win.exe
name: Dựng ứng dụng máy tính

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Dựng và đưa lên Releases (Windows .exe + latest.yml)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dựng và đưa lên Releases (macOS .dmg, không ký)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Giữ lại tệp cài
        uses: actions/upload-artifact@v4
        with:
          name: lop-hoc-${{ runner.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.yml
          if-no-files-found: error
