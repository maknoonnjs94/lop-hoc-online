document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ol C₂H₆O<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:640px;display:flex;flex-direction:column;align-items:center;gap:18px\">\n      <div style=\"width:640px;height:440px;background:#17263b;border-radius:22px;border:1px solid #21344c\">\n        <canvas data-mol=\"ethanol\" data-slide=\"1\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:var(--accent);letter-spacing:.04em\">Kéo để xoay mô hình<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"1\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Nhiều cách viết\" data-screen-label=\"02\" data-speaker-notes=\"Nhấn mạnh: không có cách viết nào 'đúng nhất' — chọn theo mục đích. Càng sang phải càng nhiều thông tin không gian.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">02 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Một phân tử, nhiều cách viết<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 38px;max-width:1500px\">CTPT → Rút gọn → Khai triển → Đường liên kết → Mô hình 3D — cùng 1 phân tử, mỗi cách phục vụ 1 mục đích.<\u002Fp>\n  <div style=\"display:flex;gap:24px\">\n    <div style=\"width:320px;height:392px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">01 · CTPT<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:600;letter-spacing:.01em\">C₂H₆O<\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Bao nhiêu nguyên tử<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:320px;height:392px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">02 · Rút gọn<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600\">CH₃CH₂OH<\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Mạch nối thế nào<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:320px;height:392px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">03 · Khai triển<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 620 300\" width=\"262\" style=\"overflow:visible\">\n          <g stroke=\"#7e93aa\" stroke-width=\"4\" stroke-linecap=\"round\">\n            <line x1=\"86\" y1=\"150\" x2=\"144\" y2=\"150\"><\u002Fline>\n            <line x1=\"196\" y1=\"150\" x2=\"284\" y2=\"150\"><\u002Fline>\n            <line x1=\"336\" y1=\"150\" x2=\"424\" y2=\"150\"><\u002Fline>\n            <line x1=\"476\" y1=\"150\" x2=\"534\" y2=\"150\"><\u002Fline>\n            <line x1=\"170\" y1=\"124\" x2=\"170\" y2=\"76\"><\u002Fline>\n            <line x1=\"170\" y1=\"176\" x2=\"170\" y2=\"224\"><\u002Fline>\n            <line x1=\"310\" y1=\"124\" x2=\"310\" y2=\"76\"><\u002Fline>\n            <line x1=\"310\" y1=\"176\" x2=\"310\" y2=\"224\"><\u002Fline>\n          <\u002Fg>\n          <g font-family=\"Inter\" font-size=\"40\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#edeae2\">\n            <text x=\"170\" y=\"150\">C<\u002Ftext><text x=\"310\" y=\"150\">C<\u002Ftext>\n            <text x=\"450\" y=\"150\" fill=\"#ff6b4a\">O<\u002Ftext>\n            <text x=\"60\" y=\"150\">H<\u002Ftext><text x=\"170\" y=\"50\">H<\u002Ftext><text x=\"170\" y=\"250\">H<\u002Ftext>\n            <text x=\"310\" y=\"50\">H<\u002Ftext><text x=\"310\" y=\"250\">H<\u002Ftext><text x=\"560\" y=\"150\">H<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Từng liên kết một<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:320px;height:392px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">04 · Đường liên kết<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 380 260\" width=\"230\" style=\"overflow:visible\">\n          <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\" fill=\"none\">\n            <polyline points=\"60,190 160,120 242,170\"><\u002Fpolyline>\n          <\u002Fg>\n          <text x=\"258\" y=\"184\" font-family=\"Inter\" font-size=\"42\" font-weight=\"600\" fill=\"#ff6b4a\">OH<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Nhanh, gọn — chuẩn hữu cơ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:320px;height:392px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">05 · Mô hình 3D<\u002Fdiv>\n      <div style=\"flex:1;margin:8px 0\">\n        <canvas data-mol=\"ethanol\" data-slide=\"2\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Hình dạng trong không gian<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:18px;margin-top:26px\">\n    <div style=\"height:2px;flex:1;background:linear-gradient(90deg,#21344c,var(--accent))\"><\u002Fdiv>\n    <div style=\"font-size:24px;color:var(--accent);letter-spacing:.04em\">càng về sau càng chi tiết về không gian<\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"2\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"CTPT\" data-screen-label=\"03\" data-speaker-notes=\"Cùng C2H6O nhưng hai chất hoàn toàn khác nhau: ethanol lỏng, sôi 78°C; dimethyl ether khí, sôi -24°C. Đây là cửa vào chương đồng phân.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">03 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Công thức phân tử (CTPT)<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 38px;max-width:1500px\">Chỉ cho biết loại và số lượng nguyên tử — không nói cách chúng liên kết với nhau.<\u002Fp>\n  <div style=\"display:flex;gap:40px;align-items:center\">\n    <div style=\"width:400px\">\n      <div style=\"font-size:88px;font-weight:600;font-family:Literata,Georgia,serif\">C₂H₆O<\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3;margin-top:14px;line-height:1.45\">2 nguyên tử C, 6 H, 1 O.<br>Có thể là:<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:32px;flex:1\">\n      <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;gap:20px;align-items:center;height:404px\">\n        <div style=\"width:250px\">\n          <div style=\"font-size:30px;font-weight:600\">Ethanol<\u002Fdiv>\n          <div style=\"font-size:26px;color:var(--accent);margin-top:8px\">CH₃CH₂OH<\u002Fdiv>\n          <div style=\"font-size:24px;color:#9fb0c3;margin-top:14px;line-height:1.4\">Lỏng, ts 78 °C<br>có nhóm –OH<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 380 260\" width=\"220\" style=\"overflow:visible;margin-top:18px\">\n            <polyline points=\"60,190 160,120 242,170\" stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpolyline>\n            <text x=\"258\" y=\"184\" font-family=\"Inter\" font-size=\"42\" font-weight=\"600\" fill=\"#ff6b4a\">OH<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;height:100%\">\n          <canvas data-mol=\"ethanol\" data-slide=\"3\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;gap:20px;align-items:center;height:404px\">\n        <div style=\"width:250px\">\n          <div style=\"font-size:30px;font-weight:600\">Dimethyl ether<\u002Fdiv>\n          <div style=\"font-size:26px;color:var(--accent);margin-top:8px\">CH₃OCH₃<\u002Fdiv>\n          <div style=\"font-size:24px;color:#9fb0c3;margin-top:14px;line-height:1.4\">Khí, ts −24 °C<br>O nằm giữa mạch<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 380 260\" width=\"220\" style=\"overflow:visible;margin-top:18px\">\n            <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\" fill=\"none\">\n              <line x1=\"60\" y1=\"190\" x2=\"146\" y2=\"132\"><\u002Fline>\n              <line x1=\"214\" y1=\"132\" x2=\"300\" y2=\"190\"><\u002Fline>\n            <\u002Fg>\n            <text x=\"180\" y=\"132\" font-family=\"Inter\" font-size=\"42\" font-weight=\"600\" fill=\"#ff6b4a\" text-anchor=\"middle\" dominant-baseline=\"central\">O<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;height:100%\">\n          <canvas data-mol=\"dme\" data-slide=\"3\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:26px;color:var(--accent);margin-top:26px\">Cùng CTPT, khác cấu tạo → đây chính là lý do có đồng phân (học kỹ ở Module 5–7).<\u002Fdiv>\n  <footer data-dots=\"3\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Rút gọn\" data-screen-label=\"04\" data-speaker-notes=\"Cho học viên bấm từng cụm rồi hỏi: cụm nào chứa dị tố? Vì sao OH luôn phải viết ra?\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">04 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Công thức cấu tạo rút gọn (condensed)<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 38px;max-width:1500px\">Nhóm nguyên tử viết liền theo mạch, không vẽ gạch liên kết: <span style=\"color:#edeae2\">CH₃CH₂OH<\u002Fspan>.<\u002Fp>\n  <div style=\"display:flex;gap:48px;align-items:flex-start\">\n    <div style=\"flex:1\">\n      <div style=\"display:flex;gap:18px;align-items:center\">\n        <div data-grp=\"CH3\" style=\"padding:22px 34px;border:2px solid var(--accent);border-radius:16px;font-size:56px;font-weight:600;cursor:pointer;background:#17263b;user-select:none\">CH₃<\u002Fdiv>\n        <div data-grp=\"CH2\" style=\"padding:22px 34px;border:2px solid var(--accent);border-radius:16px;font-size:56px;font-weight:600;cursor:pointer;background:#17263b;user-select:none\">CH₂<\u002Fdiv>\n        <div data-grp=\"OH\" style=\"padding:22px 34px;border:2px solid var(--accent);border-radius:16px;font-size:56px;font-weight:600;cursor:pointer;background:#17263b;user-select:none\">OH<\u002Fdiv>\n        <div style=\"font-size:24px;color:var(--accent);margin-left:14px;max-width:220px;line-height:1.35\">Bấm vào từng cụm để xem vị trí trên mô hình<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-grp-info=\"\" style=\"margin-top:38px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:28px 32px;min-height:168px;box-sizing:border-box\">\n        <div data-grp-title=\"\" style=\"font-size:32px;font-weight:600;color:var(--accent)\">Cách đọc công thức rút gọn<\u002Fdiv>\n        <div data-grp-body=\"\" style=\"font-size:26px;line-height:1.5;color:#9fb0c3;margin-top:12px\">Mỗi C được viết kèm ngay các H gắn trên nó; các cụm xếp theo đúng thứ tự nối với nhau trong mạch. Nhóm chức (ở đây là –OH) viết ở cuối cụm mà nó gắn vào.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:660px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"width:660px;height:404px;background:#17263b;border:1px solid #21344c;border-radius:18px\">\n        <canvas data-mol=\"ethanol\" data-slide=\"4\" data-spin=\"1\" data-hl=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#5d7186;text-align:center\">Xám xanh: C · trắng: H · đỏ cam: O — quy ước màu CPK<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"4\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Khai triển\" data-screen-label=\"05\" data-speaker-notes=\"Đếm cùng học viên: 8 liên kết, trong đó 6 liên kết C–H. Vì sao cách này không dùng cho phân tử lớn.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">05 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Công thức khai triển (gạch ngang / Kekulé)<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 30px;max-width:1500px\">Vẽ đầy đủ mọi liên kết, kể cả liên kết C–H.<\u002Fp>\n  <div style=\"display:flex;gap:40px;align-items:center\">\n    <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:20px 30px;box-sizing:border-box;display:flex;justify-content:center\">\n      <svg sc-camel-view-box=\"           <line x1=\"336\" y1=\"150\" x2=\"424\" y2=\"150\"><\u002Fline>\n          <line x1=\"476\" y1=\"150\" x2=\"534\" y2=\"150\"><\u002Fline>\n          <line x1=\"170\" y1=\"124\" x2=\"170\" y2=\"76\"><\u002Fline>\n          <line x1=\"170\" y1=\"176\" x2=\"170\" y2=\"224\"><\u002Fline>\n          <line x1=\"310\" y1=\"124\" x2=\"310\" y2=\"76\"><\u002Fline>\n          <line x1=\"310\" y1=\"176\" x2=\"310\" y2=\"224\"><\u002Fline>\n        <\u002Fg>\n        <g font-family=\"Inter\" font-size=\"42\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#edeae2\">\n          <text x=\"170\" y=\"150\">C<\u002Ftext><text x=\"310\" y=\"150\">C<\u002Ftext>\n          <text x=\"450\" y=\"150\" fill=\"#ff6b4a\">O<\u002Ftext>\n          <text x=\"60\" y=\"150\">H<\u002Ftext><text x=\"170\" y=\"50\">H<\u002Ftext><text x=\"170\" y=\"250\">H<\u002Ftext>\n          <text x=\"310\" y=\"50\">H<\u002Ftext><text x=\"310\" y=\"250\">H<\u002Ftext><text x=\"560\" y=\"150\">H<\u002Ftext>\n        <\u002Fg>\n        <g data-lonepairs=\"\" style=\"opacity:0;transition:opacity .25s\" fill=\"#ffd9a0\">\n          <circle cx=\"436\" cy=\"104\" r=\"8\"><\u002Fcircle><circle cx=\"464\" cy=\"104\" r=\"8\"><\u002Fcircle>\n          <circle cx=\"436\" cy=\"196\" r=\"8\"><\u002Fcircle><circle cx=\"464\" cy=\"196\" r=\"8\"><\u002Fcircle>\n        <\u002Fg>\n        <circle data-o-hit=\"\" cx=\"450\" cy=\"150\" r=\"46\" fill=\"transparent\" stroke=\"#e8a33d\" stroke-width=\"3\" stroke-dasharray=\"6 8\" style=\"cursor:pointer\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div data-lewis-hint=\"\" style=\"font-size:24px;color:var(--accent);margin-top:14px\">Bấm vào O để hiện 2 cặp electron chưa chia<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:440px;background:#17263b;border:1px solid #21344c;border-radius:18px;display:flex;flex-direction:column\">\n      <div style=\"flex:1\">\n        <canvas data-mol=\"ethanol\" data-slide=\"6\" data-spin=\"1\" data-lewis=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#5d7186;text-align:center;padding:0 16px 16px\">Cặp riêng chiếm chỗ quanh O trong không gian<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:28px 32px;box-sizing:border-box\">\n      <div style=\"font-size:28px;font-weight:600;margin-bottom:22px\">Ôn quy tắc octet<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;gap:18px;align-items:baseline\">\n          <div style=\"font-size:38px;font-weight:700;color:#7c8b9c;width:44px\">C<\u002Fdiv>\n          <div style=\"font-size:25px;color:#9fb0c3;line-height:1.4\">4 liên kết, không cặp riêng<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline\">\n          <div style=\"font-size:38px;font-weight:700;color:#6f9dff;width:44px\">N<\u002Fdiv>\n          <div style=\"font-size:25px;color:#9fb0c3;line-height:1.4\">3 liên kết + 1 cặp riêng<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline\">\n          <div style=\"font-size:38px;font-weight:700;color:#ff6b4a;width:44px\">O<\u002Fdiv>\n          <div style=\"font-size:25px;color:#9fb0c3;line-height:1.4\">2 liên kết + 2 cặp riêng<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"6\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Đường liên kết\" data-screen-label=\"07\" data-speaker-notes=\"Quy tắc sống còn của hoá hữu cơ. Nhấn: đỉnh và đầu mút đều là carbon; H trên carbon được ngầm hiểu, H trên O thì phải viết.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">07 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Công thức đường liên kết (bond-line / skeletal)<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 30px;max-width:1500px\">Cách viết tiêu chuẩn của hoá hữu cơ — nhanh và làm nổi bật nhóm chức.<\u002Fp>\n  <div style=\"display:flex;gap:40px;align-items:stretch\">\n    <div style=\"width:620px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px 28px;display:flex;gap:18px;align-items:flex-start\">\n        <div style=\"width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none\"><\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.45\">Liên kết vẽ bằng <span style=\"color:var(--accent)\">đường<\u002Fspan>; mỗi đỉnh và mỗi đầu mút là một nguyên tử carbon.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px 28px;display:flex;gap:18px;align-items:flex-start\">\n        <div style=\"width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none\"><\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.45\"><span style=\"color:var(--accent)\">Ẩn<\u002Fspan> carbon và H gắn trên carbon.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px 28px;display:flex;gap:18px;align-items:flex-start\">\n        <div style=\"width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none\"><\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.45\"><span style=\"color:var(--accent)\">Phải viết<\u002Fspan> dị tố (N, O, S, P, halogen) và H gắn trên dị tố.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:26px;box-sizing:border-box;display:flex;align-items:center;gap:22px\">\n      <div style=\"flex:1;text-align:center\">\n        <svg sc-camel-view-box=\"0 0 620 300\" width=\"440\" style=\"overflow:visible\">\n          <g stroke=\"#7e93aa\" stroke-width=\"4\" stroke-linecap=\"round\">\n            <line x1=\"86\" y1=\"150\" x2=\"144\" y2=\"150\"><\u002Fline>\n            <line x1=\"196\" y1=\"150\" x2=\"284\" y2=\"150\"><\u002Fline>\n            <line x1=\"336\" y1=\"150\" x2=\"424\" y2=\"150\"><\u002Fline>\n            <line x1=\"476\" y1=\"150\" x2=\"534\" y2=\"150\"><\u002Fline>\n            <line x1=\"170\" y1=\"124\" x2=\"170\" y2=\"76\"><\u002Fline>\n            <line x1=\"170\" y1=\"176\" x2=\"170\" y2=\"224\"><\u002Fline>\n            <line x1=\"310\" y1=\"124\" x2=\"310\" y2=\"76\"><\u002Fline>\n            <line x1=\"310\" y1=\"176\" x2=\"310\" y2=\"224\"><\u002Fline>\n          <\u002Fg>\n          <g font-family=\"Inter\" font-size=\"42\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#edeae2\">\n            <text x=\"170\" y=\"150\">C<\u002Ftext><text x=\"310\" y=\"150\">C<\u002Ftext>\n            <text x=\"450\" y=\"150\" fill=\"#ff6b4a\">O<\u002Ftext>\n            <text x=\"60\" y=\"150\">H<\u002Ftext><text x=\"170\" y=\"50\">H<\u002Ftext><text x=\"170\" y=\"250\">H<\u002Ftext>\n            <text x=\"310\" y=\"50\">H<\u002Ftext><text x=\"310\" y=\"250\">H<\u002Ftext><text x=\"560\" y=\"150\">H<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n        <div style=\"font-size:24px;color:#9fb0c3;margin-top:10px\">khai triển<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:56px;color:var(--accent);flex:none\">→<\u002Fdiv>\n      <div style=\"flex:1;text-align:center\">\n        <svg sc-camel-view-box=\"0 0 380 260\" width=\"300\" style=\"overflow:visible\">\n          <polyline points=\"60,190 160,120 242,170\" stroke=\"#edeae2\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpolyline>\n          <text x=\"258\" y=\"184\" font-family=\"Inter\" font-size=\"46\" font-weight=\"600\" fill=\"#ff6b4a\">OH<\u002Ftext>\n          <circle cx=\"160\" cy=\"120\" r=\"10\" fill=\"var(--accent)\"><\u002Fcircle>\n          <circle cx=\"60\" cy=\"190\" r=\"10\" fill=\"var(--accent)\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-size:24px;color:#9fb0c3;margin-top:10px\">đường liên kết — 2 chấm vàng là 2 carbon<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"7\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Liên kết bội\" data-screen-label=\"08\" data-speaker-notes=\"Nhấn: đôi tính là 2 liên kết, ba tính là 3 liên kết khi đếm H ẩn. Cho kéo xoay ethyne để thấy phân tử thẳng.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">08 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Liên kết đôi và liên kết ba<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 26px;max-width:1500px\">Liên kết đôi vẽ 2 đường song song, liên kết ba vẽ 3 đường. Đỉnh vẫn là carbon.<\u002Fp>\n  <div style=\"display:flex;gap:28px\">\n    <div style=\"width:552px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Liên kết đôi · alkene<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex:1\">\n        <svg sc-camel-view-box=\"0 0 300 200\" width=\"250\" style=\"overflow:visible\">\n          <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\">\n            <line x1=\"80\" y1=\"86\" x2=\"220\" y2=\"86\"><\u002Fline>\n            <line x1=\"80\" y1=\"114\" x2=\"220\" y2=\"114\"><\u002Fline>\n          <\u002Fg>\n          <circle cx=\"80\" cy=\"100\" r=\"9\" fill=\"var(--accent)\"><\u002Fcircle>\n          <circle cx=\"220\" cy=\"100\" r=\"9\" fill=\"var(--accent)\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"flex:1;height:100%\">\n          <canvas data-mol=\"ethene\" data-slide=\"8\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\"><span style=\"color:#edeae2\">CH₂=CH₂ · ethene<\u002Fspan> — mỗi C còn 2 H ẩn, phân tử phẳng<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:552px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Liên kết ba · alkyne<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex:1\">\n        <svg sc-camel-view-box=\"0 0 300 200\" width=\"250\" style=\"overflow:visible\">\n          <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\">\n            <line x1=\"80\" y1=\"78\" x2=\"220\" y2=\"78\"><\u002Fline>\n            <line x1=\"80\" y1=\"100\" x2=\"220\" y2=\"100\"><\u002Fline>\n            <line x1=\"80\" y1=\"122\" x2=\"220\" y2=\"122\"><\u002Fline>\n          <\u002Fg>\n          <circle cx=\"80\" cy=\"100\" r=\"9\" fill=\"var(--accent)\"><\u002Fcircle>\n          <circle cx=\"220\" cy=\"100\" r=\"9\" fill=\"var(--accent)\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"flex:1;height:100%\">\n          <canvas data-mol=\"ethyne\" data-slide=\"8\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\"><span style=\"color:#edeae2\">CH≡CH · ethyne<\u002Fspan> — mỗi C chỉ còn 1 H ẩn, 4 nguyên tử thẳng hàng<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:552px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Liên kết đôi với dị tố<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 300 170\" width=\"300\" style=\"overflow:visible\">\n          <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\">\n            <line x1=\"60\" y1=\"140\" x2=\"150\" y2=\"88\"><\u002Fline>\n            <line x1=\"150\" y1=\"88\" x2=\"240\" y2=\"140\"><\u002Fline>\n          <\u002Fg>\n          <g stroke=\"#ff6b4a\" stroke-width=\"7\" stroke-linecap=\"round\">\n            <line x1=\"142\" y1=\"80\" x2=\"142\" y2=\"40\"><\u002Fline>\n            <line x1=\"158\" y1=\"80\" x2=\"158\" y2=\"40\"><\u002Fline>\n          <\u002Fg>\n          <text x=\"150\" y=\"20\" font-family=\"Inter\" font-size=\"38\" font-weight=\"600\" fill=\"#ff6b4a\" text-anchor=\"middle\">O<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">CH₃COCH₃ · acetone — nhóm carbonyl C=O, O luôn phải viết ra<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:26px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:16px 28px;margin-top:22px\">\n    <svg sc-camel-view-box=\"0 0 300 150\" width=\"180\" style=\"overflow:visible;flex:none\">\n      <g stroke=\"#edeae2\" stroke-width=\"7\" stroke-linecap=\"round\">\n        <line x1=\"60\" y1=\"130\" x2=\"150\" y2=\"80\"><\u002Fline>\n        <line x1=\"70\" y1=\"137\" x2=\"149\" y2=\"93\"><\u002Fline>\n        <line x1=\"150\" y1=\"80\" x2=\"240\" y2=\"130\"><\u002Fline>\n      <\u002Fg>\n      <circle cx=\"150\" cy=\"80\" r=\"9\" fill=\"var(--accent)\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"font-size:26px;line-height:1.45\">Đếm H ẩn: <span style=\"color:var(--accent)\">liên kết đôi tính là 2, liên kết ba tính là 3<\u002Fspan>. Propene CH₂=CH–CH₃ — đỉnh giữa có 1 đôi + 1 đơn = 3 liên kết → 4 − 3 = 1 H.<\u002Fdiv>\n  <\u002Fdiv>\n  <footer data-dots=\"8\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Mạch vòng\" data-screen-label=\"09\" data-speaker-notes=\"Hình vẽ phẳng chỉ là quy ước; xoay mô hình cyclohexane để thấy dạng ghế. Benzene thì thực sự phẳng.\" style=\"display:flex;flex-direction:column;background:#0f1b2b;color:#edeae2;font-family:Inter,system-ui,sans-serif;padding:70px 104px 40px;box-sizing:border-box;overflow:hidden\">\n  <header style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div style=\"font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9fb0c3\">Module 3 · Biểu diễn cấu tạo<\u002Fdiv>\n    <div style=\"font-size:24px;font-weight:500;letter-spacing:.12em;color:#5d7186\">09 / 12<\u002Fdiv>\n  <\u002Fheader>\n  <h2 style=\"font-family:Literata,Georgia,serif;font-weight:600;font-size:58px;margin:34px 0 14px\">Mạch vòng<\u002Fh2>\n  <p style=\"font-size:29px;line-height:1.45;color:#9fb0c3;margin:0 0 26px;max-width:1500px\">Mạch carbon khép kín: mỗi đỉnh của đa giác là một carbon, H trên carbon vẫn ẩn.<\u002Fp>\n  <div style=\"display:flex;gap:24px\">\n    <div style=\"width:330px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Vòng 5 cạnh<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 300 300\" width=\"200\" style=\"overflow:visible\">\n          <polygon points=\"150,70 226,125 197,215 103,215 74,125\" fill=\"none\" stroke=\"#edeae2\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Cyclopentane C₅H₁₀ — 5 C, mỗi C 2 H ẩn<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:330px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Vòng 6 cạnh<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 300 300\" width=\"200\" style=\"overflow:visible\">\n          <polygon points=\"150,70 219,110 219,190 150,230 81,190 81,110\" fill=\"none\" stroke=\"#edeae2\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Cyclohexane C₆H₁₂ — vòng no phổ biến nhất<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:330px;height:372px;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"font-size:24px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d7186\">Vòng thơm<\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 300 300\" width=\"200\" style=\"overflow:visible\">\n          <polygon points=\"150,70 219,110 219,190 150,230 81,190 81,110\" fill=\"none\" stroke=\"#edeae2\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpolygon>\n          <circle cx=\"150\" cy=\"150\" r=\"46\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"6\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3\">Benzene C₆H₆ — 3 liên kết đôi xen kẽ, vẽ gọn bằng vòng tròn<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#17263b;border:1px solid #21344c;border-radius:18px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column\">\n      <div style=\"flex:1\">\n        <canvas data-mol=\"cyclohexane\" data-slide=\"9\" data-spin=\"1\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:grab\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;color:#9fb0c3;text-align:center\">Xoay để thấy: vòng no <span style=\"color:var(--accent)\">không phẳng<\u002Fspan> — cyclohexane ở dạng ghế<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:26px;color:var(--accent);margin-top:22px\">Hình đa giác trên giấy chỉ là quy ước vẽ; hình dạng thật trong không gian là chuyện khác — sẽ quay lại ở phần cấu dạng.<\u002Fdiv>\n  <footer data-dots=\"9\" style=\"display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto\"><\u002Ffooter>\n<\u002Fsection>\n\n<section data-label=\"Phân tử thật\" data-screen-label=\"10\" data-speaker-notes=\"Cho học viên tự đếm C và H trước khi lật đ i === own;\n        d.style.width = isOwn ? '30px' : '10px';\n        d.style.background = isOwn ? a : (i < own ? '#3a5170' : '#22334a');\n      });\n    });\n  }\n\n  /* ---------- 3D ball & stick on 2D canvas ---------- */\n  makeViewer(cv) {\n    const mol = this.MOLS[cv.dataset.mol];\n    const atoms = mol.atoms;\n    if (mol.bl) mol.bonds = mol.bl;\n    if (!mol.bonds) {\n      const bs = [];\n      for (let i = 0; i < atoms.length; i++) for (let j = i + 1; j < atoms.length; j++) {\n        if (atoms[i].e === 'H' && atoms[j].e === 'H') continue;\n        const d = Math.hypot(atoms[i].p[0] - atoms[j].p[0], atoms[i].p[1] - atoms[j].p[1], atoms[i].p[2] - atoms[j].p[2]);\n        if (d < 1.72) bs.push([i, j, 1]);\n      }\n      mol.bonds = bs;\n    }\n    const v = {\n      cv, ctx: cv.getContext('2d'), mol, rx: -0.18, ry: 0.5, dirty: true, drag: false,\n      spin: cv.dataset.spin === '1', hl: null, lp: false\n    };\n    v.draw = () => this.draw(v);\n    v.oIndex = atoms.findIndex(a => a.e === 'O');\n    cv.addEventListener('pointerdown', e => {\n      v.drag = true; v.px = e.clientX; v.py = e.clientY; v.moved = 0;\n      cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing';\n    });\n    cv.addEventListener('pointermove', e => {\n      if (!v.drag) return;\n      const dx = e.clientX - v.px, dy = e.clientY - v.py;\n      v.px = e.clientX; v.py = e.clientY; v.moved += Math.abs(dx) + Math.abs(dy);\n      v.ry += dx * 0.011; v.rx += dy * 0.011;\n      v.rx = Math.max(-1.35, Math.min(1.35, v.rx));\n      v.dirty = true;\n    });\n    const end = e => {\n      if (!v.drag) return;\n      v.drag = false; cv.style.cursor = 'grab';\n      if (v.moved < 6 && cv.dataset.lewis === '1') this.toggleLewis();\n    };\n    cv.addEventListener('pointerup', end);\n    cv.addEventListener('pointercancel', end);\n    return v;\n  }\n\n  draw(v) {\n    const cv = v.cv, ctx = v.ctx;\n    const w = cv.clientWidth, h = cv.clientHeight;\n    if (!w || !h) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    ctx.clearRect(0, 0, w, h);\n    v.dirty = false;\n\n    const atoms = v.mol.atoms;\n    const cos = Math.cos, sin = Math.sin;\n    const cy_ = cos(v.ry), sy = sin(v.ry), cx = cos(v.rx), sx = sin(v.rx);\n    const rot = p => {\n      const x1 = p[0] * cy_ + p[2] * sy, z1 = -p[0] * sy + p[2] * cy_;\n      return [x1, p[1] * cx - z1 * sx, p[1] * sx + z1 * cx];\n    };\n    let maxR = 0;\n    atoms.forEach(a => { maxR = Math.max(maxR, Math.hypot(a.p[0], a.p[1], a.p[2])); });\n    const S = Math.min(w, h) * 0.40 / (maxR + 0.55);\n    const d = 16;\n    const proj = q => { const s = d / (d - q[2]); return [w / 2 + q[0] * s * S, h / 2 - q[1] * s * S, q[2], s]; };\n    const P = atoms.map(a => proj(rot(a.p)));\n\n    const dim = !!v.hl;\n    const items = [];\n    v.mol.bonds.forEach(b => {\n      [[b[0], b[1]], [b[1], b[0]]].forEach(pair => {\n        const A = P[pair[0]], B = P[pair[1]];\n        const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;\n        const bx = B[0] - A[0], by = B[1] - A[1], bL = Math.hypot(bx, by) || 1;\n        items.push({ z: (A[2] * 0.7 + B[2] * 0.3), t: 'b', a: A, m: [mx, my], el: atoms[pair[0]].e, g: atoms[pair[0]].g, o: b[2] || 1, px: -by / bL, py: bx / bL });\n      });\n    });\n    atoms.forEach((a, i) => items.push({ z: P[i][2], t: 'a', p: P[i], el: a.e, g: a.g, i }));\n    if (v.lp && v.oIndex >= 0) this.lonePairs(v, atoms, rot, proj).forEach(pt => items.push({ z: pt[2], t: 'e', p: pt }));\n    items.sort((p, q) => p.z - q.z);\n\n    items.forEach(it => {\n      const on = !dim || it.g === v.hl;\n      ctx.globalAlpha = on ? 1 : 0.22;\n      if (it.t === 'b') {\n        ctx.strokeStyle = this.COL[it.el] || '#c8cfd8';\n        ctx.lineCap = 'round';\n        ctx.lineWidth = Math.max(2, (it.o > 1 ? 0.10 : 0.16) * S * it.a[3]);\n        const sep = 0.155 * S * it.a[3];\n        const offs = it.o === 3 ? [-1, 0, 1] : it.o === 2 ? [-0.55, 0.55] : [0];\n        offs.forEach(k => {\n          ctx.beginPath();\n          ctx.moveTo(it.a[0] + it.px * k * sep, it.a[1] + it.py * k * sep);\n          ctx.lineTo(it.m[0] + it.px * k * sep, it.m[1] + it.py * k * sep);\n          ctx.stroke();\n        });\n      } else if (it.t === 'a') {\n        const r = this.RAD[it.el] * S * it.p[3];\n        const g = ctx.createRadialGradient(it.p[0] - r * 0.38, it.p[1] - r * 0.42, r * 0.08, it.p[0], it.p[1], r);\n        g.addColorStop(0, this.LIT[it.el]); g.addColorStop(0.55, this.COL[it.el]); g.addColorStop(1, this.shade(this.COL[it.el]));\n        ctx.fillStyle = g;\n        ctx.beginPath(); ctx.arc(it.p[0], it.p[1], r, 0, 6.2832); ctx.fill();\n        if (on && dim && it.g === v.hl) {\n          ctx.strokeStyle = this.accent(); ctx.lineWidth = 3;\n          ctx.beginPath(); ctx.arc(it.p[0], it.p[1], r + 5, 0, 6.2832); ctx.stroke();\n        }\n      } else {\n        ctx.fillStyle = '#ffd9a0';\n        ctx.beginPath(); ctx.arc(it.p[0], it.p[1], Math.max(2.5, 0.055 * S * it.p[3]), 0, 6.2832); ctx.fill();\n      }\n    });\n    ctx.globalAlpha = 1;\n  }\n\n  lonePairs(v, atoms, rot, proj) {\n    const oi = v.oIndex, o = atoms[oi].p;\n    const nb = v.mol.bonds.filter(b => b[0] === oi || b[1] === oi).map(b => atoms[b[0] === oi ? b[1] : b[0]].p);\n    if (nb.length < 2) return [];\n    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];\n    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];\n    const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];\n    const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };\n    const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];\n    const u1 = nrm(sub(nb[0], o)), u2 = nrm(sub(nb[1], o));\n    const bis = nrm(add(u1, u2)), n = nrm(crs(u1, u2));\n    const c = Math.cos(0.95), s = Math.sin(0.95);\n    const dirs = [nrm(add(mul(bis, -c), mul(n, s))), nrm(add(mul(bis, -c), mul(n, -s)))];\n    const out = [];\n    dirs.forEach(dir => {\n      const per = nrm(crs(dir, bis));\n      [-1, 1].forEach(k => out.push(proj(rot(add(o, add(mul(dir, 0.66), mul(per, 0.17 * k)))))));\n    });\n    return out;\n  }\n\n  shade(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    const r = Math.round(((n >> 16) & 255) * 0.42), g = Math.round(((n >> 8) & 255) * 0.42), b = Math.round((n & 255) * 0.42);\n    return 'rgb(' + r + ',' + g + ',' + b + ')';\n  }\n\n  /* ---------- slide 4: condensed groups ---------- */\n  wireChips() {\n    const info = {\n      CH3: ['CH₃ — nhóm methyl', '1 carbon mang 3 hydro, nằm ở đầu mạch. Carbon này chỉ còn 1 liên kết để nối tiếp vào mạch.'],\n      CH2: ['CH₂ — nhóm methylen', '1 carbon mang 2 hydro, nối hai phía: một bên là CH₃, một bên là O của nhóm OH.'],\n      OH: ['OH — nhóm hydroxyl', 'Nhóm chức của alcohol. O có 2 liên kết (với C và với H) cùng 2 cặp electron chưa chia.']\n    };\n    const v4 = this.viewers.find(v => v.cv.dataset.hl === '1');\n    const chips = Array.from(document.querySelectorAll('[data-grp]'));\n    const t = document.querySelector('[data-grp-title]'), b = document.querySelector('[data-grp-body]');\n    chips.forEach(ch => ch.addEventListener('click', () => {\n      const g = ch.dataset.grp;\n      const same = v4 && v4.hl === g;\n      chips.forEach(c => {\n        const on = !same && c === ch;\n        c.style.background = on ? this.accent() : '#17263b';\n        c.style.color = on ? '#0f1b2b' : '#edeae2';\n      });\n      if (v4) { v4.hl = same ? null : g; v4.dirty = true; }\n      if (t && b) {\n        if (same) { t.textContent = 'Cách đọc công thức rút gọn'; b.textContent = 'Mỗi C được viết kèm ngay các H gắn trên nó; các cụm xếp theo đúng thứ tự nối với nhau trong mạch. Nhóm chức (ở đây là –OH) viết ở cuối cụm mà nó gắn vào.'; }\n        else { t.textContent = info[g][0]; b.textContent = info[g][1]; }\n      }\n    }));\n  }\n\n  /* ---------- slide 6: Lewis lone pairs ---------- */\n  toggleLewis() {\n    const g = document.querySelector('[data-lonepairs]');\n    const on = !(g && g.style.opacity === '1');\n    if (g) g.style.opacity = on ? '1' : '0';\n    const hint = document.querySelector('[data-lewis-hint]');\n    if (hint) hint.textContent = on ? 'O có 2 cặp electron chưa chia + 2 liên kết → đủ octet' : 'Bấm vào O để hiện 2 cặp electron chưa chia';\n    this.viewers.forEach(v => { if (v.cv.dataset.lewis === '1') { v.lp = on; v.dirty = true; } });\n  }\n  wireLewis() {\n    const hit = document.querySelector('[data-o-hit]');\n    if (hit) hit.addEventListener('click', () => this.toggleLewis());\n  }\n\n  /* ---------- slide 8: count hidden H ---------- */\n  wireVertices() {\n    const gs = Array.from(document.querySelectorAll('[data-vgroup]'));\n    const cnt = document.querySelector('[data-vcount]');\n    const res = document.querySelector('[data-vresult]');\n    const nm = document.querySelector('[data-vname]');\n    const fm = document.querySelector('[data-vformula]');\n    const found = new Set();\n    const refresh = () => {\n      if (cnt) cnt.textContent = found.size + ' / 5 đỉnh';\n      const done = found.size === 5;\n      if (res) res.style.opacity = done ? '1' : '.35';\n      if (nm) nm.textContent = done ? '3-methylbutan-1-ol' : '? ? ?';\n      if (fm) fm.textContent = done ? 'C₅H₁₂O · (CH₃)₂CHCH₂CH₂OH — tổng 12 H, trong đó 11 H ẩn trên carbon.' : 'Kiểm tra hết 5 đỉnh để hiện tên và CTPT.';\n    };\n    gs.forEach(g => {\n      const dot = g.querySelector('[data-vdot]'), badge = g.querySelector('[data-vbadge]');\n      g.addEventListener('click', () => {\n        found.add(g.dataset.vgroup);\n        dot.style.opacity = '1'; badge.style.opacity = '1';\n        dot.setAttribute('fill', this.accent()); badge.setAttribute('fill', this.accent());\n        refresh();\n      });\n    });\n    const rst = document.querySelector('[data-vreset]');\n    if (rst) rst.addEventListener('click', () => {\n      found.clear();\n      gs.forEach(g => { g.querySelector('[data-vdot]').style.opacity = '0'; g.querySelector('[data-vbadge]').style.opacity = '0'; });\n      refresh();\n    });\n  }\n\n  /* ---------- slide 9: pointer drag & drop ---------- */\n  wireDrag() {\n    const tiles = Array.from(document.querySelectorAll('[data-tile]'));\n    const slots = Array.from(document.querySelectorAll('[data-slot]'));\n    const counter = document.querySelector('[data-dd-count]');\n    let ok = 0;\n    tiles.forEach(t => {\n      let sx = 0, sy = 0, scale = 1, on = false;\n      t.addEventListener('pointerdown', e => {\n        if (t.dataset.locked) return;\n        on = true; sx = e.clientX; sy = e.clientY;\n        const r = t.getBoundingClientRect();\n        scale = r.width / (t.offsetWidth || r.width);\n        t.setPointerCapture(e.pointerId);\n        t.style.transition = 'none'; t.style.zIndex = '60'; t.style.cursor = 'grabbing';\n        t.style.boxShadow = '0 18px 40px rgba(0,0,0,.45)';\n      });\n      t.addEventListener('pointermove', e => {\n        if (!on) return;\n        t.style.transform = 'translate(' + (e.clientX - sx) / scale + 'px,' + (e.clientY - sy) / scale + 'px)';\n      });\n      const drop = e => {\n        if (!on) return;\n        on = false; t.style.cursor = 'grab'; t.style.boxShadow = 'none';\n        const target = slots.find(s => {\n          const r = s.getBoundingClientRect();\n          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;\n        });\n        if (target && target.dataset.slot === t.dataset.tile) {\n          t.style.transition = 'none'; t.style.transform = ''; t.style.zIndex = '';\n          t.style.borderColor = '#7ec8a0'; t.style.cursor = 'default';\n          t.dataset.locked = '1';\n          target.style.border = '2px solid #7ec8a0';\n          target.appendChild(t);\n          ok++;\n          if (counter) counter.textContent = 'Đúng ' + ok + ' / 4' + (ok === 4 ? ' — hoàn thành' : '');\n        } else {\n          t.style.transition = 'transform .22s ease-out';\n          t.style.transform = '';\n          setTimeout(() => { t.style.zIndex = ''; }, 230);\n        }\n      };\n      t.addEventListener('pointerup', drop);\n      t.addEventListener('pointercancel', drop);\n    });\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
